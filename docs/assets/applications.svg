<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Potential applications</title><desc id="desc">Four potential downstream workflows use scored candidates. Experimental activity is an independent external input, not inferred by this pipeline.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#607387"/></marker></defs>
<rect width="1000" height="470" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#203348">
<text x="30" y="38" font-size="24" fill="#203348" font-weight="bold">Potential applications · compare within a fixed target and reference</text>
<rect x="30" y="70" width="455" height="125" rx="12" fill="#f3f7fd" stroke="#2864b4" stroke-width="1.5"/>
<text x="48" y="101" font-size="20" fill="#2864b4" font-weight="bold">Screen redesigned libraries</text>
<text x="48" y="134" font-size="18" fill="#203348" font-weight="normal">Rank candidates by predicted fold similarity.</text>
<text x="48" y="160" font-size="18" fill="#203348" font-weight="normal">Include a predicted WT-sequence baseline.</text>
<rect x="515" y="70" width="455" height="125" rx="12" fill="#f3f7fd" stroke="#2864b4" stroke-width="1.5"/>
<text x="533" y="101" font-size="20" fill="#2864b4" font-weight="bold">Compare candidate sets</text>
<text x="533" y="134" font-size="18" fill="#203348" font-weight="normal">Compare distributions across design strategies.</text>
<text x="533" y="160" font-size="18" fill="#203348" font-weight="normal">Use the same reference, chain, and model.</text>
<rect x="30" y="225" width="455" height="125" rx="12" fill="#f3f7fd" stroke="#2864b4" stroke-width="1.5"/>
<text x="48" y="256" font-size="20" fill="#2864b4" font-weight="bold">Inspect low-scoring outliers</text>
<text x="48" y="289" font-size="18" fill="#203348" font-weight="normal">Check alignment, coverage, and truncations.</text>
<text x="48" y="315" font-size="18" fill="#203348" font-weight="normal">Inspect local active sites and interfaces.</text>
<rect x="515" y="225" width="455" height="125" rx="12" fill="#f0f8f5" stroke="#18786b" stroke-width="1.5"/>
<text x="533" y="256" font-size="20" fill="#18786b" font-weight="bold">Relate structure to measured properties</text>
<text x="533" y="289" font-size="18" fill="#203348" font-weight="normal">Join scored candidates to independent assays.</text>
<text x="533" y="315" font-size="18" fill="#203348" font-weight="normal">Test associations; do not infer activity from TM.</text>
<rect x="30" y="390" width="940" height="54" rx="10" fill="#fff7ee" stroke="#b15b16"/>
<text x="50" y="423" font-size="19" fill="#b15b16" font-weight="normal">External input: independently measured activity, binding, stability, or other properties</text>
<path d="M745 390 V357" fill="none" stroke="#607387" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
</g></svg>
